name: Lighthouse CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Audit local production preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lighthouse-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Audit local preview
        shell: bash
        run: |
          set -uo pipefail

          preview_pid=""
          cleanup() {
            if [[ -n "$preview_pid" ]]; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/neuraconcept-preview.log" 2>&1 &
          preview_pid=$!

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo 'Local preview did not become ready.' >&2
            cat "$RUNNER_TEMP/neuraconcept-preview.log" >&2 || true
            exit 1
          fi

          set +e
          lhci collect \
            --url=http://127.0.0.1:4173/ \
            --url=http://127.0.0.1:4173/gradeowl \
            --url=http://127.0.0.1:4173/technology \
            --url=http://127.0.0.1:4173/pricing \
            --url=http://127.0.0.1:4173/waitlist
          collect_status=$?

          # Preserve reports even when collection or assertions fail.
          lhci upload --target=temporary-public-storage
          upload_status=$?

          lhci assert
          assert_status=$?

          if [[ "$collect_status" -ne 0 ]]; then
            exit "$collect_status"
          fi
          if [[ "$assert_status" -ne 0 ]]; then
            exit "$assert_status"
          fi
          exit "$upload_status"

      - name: Comment scores on PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '.lighthouseci';
            if (!fs.existsSync(dir)) {
              core.warning('No Lighthouse output found.');
              return;
            }
            const lhrFiles = fs.readdirSync(dir).filter(f => f.startsWith('lhr-') && f.endsWith('.json'));
            if (!lhrFiles.length) {
              core.warning('No lhr-*.json files in .lighthouseci/');
              return;
            }
            // numberOfRuns > 1 produces multiple lhr files per URL; group + take the last (highest-numbered) run per URL.
            const byUrl = new Map();
            for (const f of lhrFiles.sort()) {
              const lhr = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
              byUrl.set(lhr.finalUrl, lhr);
            }
            const rows = [...byUrl.values()].map((lhr) => {
              const url = new URL(lhr.finalUrl);
              const route = url.pathname || '/';
              const pct = (k) => Math.round(((lhr.categories[k]?.score) ?? 0) * 100);
              const ms = (k) => {
                const v = lhr.audits[k]?.numericValue;
                return v ? `${(v / 1000).toFixed(1)}s` : '—';
              };
              return `| \`${route}\` | ${pct('performance')} | ${pct('accessibility')} | ${pct('best-practices')} | ${pct('seo')} | ${ms('largest-contentful-paint')} | ${ms('total-blocking-time')} | ${(lhr.audits['cumulative-layout-shift']?.numericValue ?? 0).toFixed(3)} |`;
            });
            const marker = '<!-- lighthouse-ci-comment -->';
            const body = [
              marker,
              '### Lighthouse CI',
              '',
              '| Route | Perf | A11y | BP | SEO | LCP | TBT | CLS |',
              '|---|---:|---:|---:|---:|---:|---:|---:|',
              ...rows,
              '',
              'Hard fails (block PR): color-contrast, image-alt, html-has-lang, meta-description, document-title, CLS > 0.1.',
              'Warn-only (visible, non-blocking): category scores, heading-order, render-blocking, LCP, FCP, TBT, resource budgets.'
            ].join('\n');

            // Find existing comment by marker; update in place to avoid spamming the PR.
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const prior = existing.find((c) => (c.body || '').includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Assert
        run: lhci assert
